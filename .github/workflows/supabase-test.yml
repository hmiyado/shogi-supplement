name: Supabase regression
on:
  pull_request:
    paths:
      - 'infra/supabase/**'
      - 'tools/db-regression/**'
      - '.github/workflows/supabase-test.yml'
  push:
    branches: [main]
    paths:
      - 'infra/supabase/**'
      - 'tools/db-regression/**'
      - '.github/workflows/supabase-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Start isolated local Supabase
        run: npx --yes supabase@2.118.0 start --workdir infra
      - name: Test current client before and after migration and all SQL contracts
        run: python3 tools/db-regression/run.py
      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.118.0 stop --workdir infra
