name: VRT

# 画面のスクリーンショット比較（Roborazzi）を全件実行する。
# Why not ローカルの開発ループで全件回す: 1回30〜70分かかりテストJVMがOOMしやすい。
# 開発中は変更に関係する画面だけを流し（app/docs/vrt.md）、全件の担保はここで行う。
on:
  schedule:
    # GitHub ActionsのcronはUTC。18:00 UTC = 03:00 JST。
    - cron: "0 18 * * *"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/vrt.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/vrt.yml"
  workflow_dispatch:

concurrency:
  group: vrt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 追加された画面がどのshardにも含まれないまま、検証されずに緑になるのを防ぐ。
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check every screenshot test belongs to a shard
        run: python3 .github/scripts/check_vrt_shards.py

  verify:
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 撮影枚数で釣り合いを取る（ReportViewerだけで22枚あるため単独）。
        shard:
          - name: report-viewer
            tests: --tests "*ReportViewerScreenshotTest"
          - name: board-and-drill
            tests: --tests "*ShogiBoardViewScreenshotTest" --tests "*DrillScreenScreenshotTest" --tests "*GameListScreenScreenshotTest" --tests "*HomeScreenScreenshotTest" --tests "*PendingAnalysisScreenScreenshotTest"
          - name: rest
            tests: --tests "*ForceUpdateScreenScreenshotTest" --tests "*AccountScreenScreenshotTest" --tests "*AccountDeleteDialogScreenshotTest" --tests "*GameDeleteDialogScreenshotTest" --tests "*TransferCodeScreenScreenshotTest" --tests "*SettingsScreenScreenshotTest" --tests "*LicensesScreenScreenshotTest" --tests "*AnalyzingReportScreenScreenshotTest" --tests "*GameRestoreScreenScreenshotTest" --tests "*ReportGameInfoDialogScreenshotTest" --tests "*ConsentScreenScreenshotTest" --tests "*EstimatedStrengthDetailScreenScreenshotTest" --tests "*GameCardScreenshotTest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      # Why not v6以降: キャッシュ機能がMIT対象外の商用コンポーネントへ分離され、
      # 使用にGradle社のTerms of Useへの同意が必要になったため（worker-test.ymlと同じ理由）。
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Why not android-actions/setup-android: サードパーティのアクションを使うと
      # リポジトリのアクション許可設定に依存し、許可されていない環境ではジョブが
      # 起動すらしない（startup_failure）。ランナー同梱のSDKへ必要な版だけ足す。
      - name: Set up Android SDK
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager が $SDKMANAGER に見つからない" >&2
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          # ライセンス同意はsdkmanagerが読み切る前に終了するためSIGPIPEでyesが落ちる。
          # 失敗扱いにしない。
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      # Why not ジョブの制限時間だけに任せる: 超過するとジョブはcancelled扱いになり、
      # 下のfailure()が発火せず比較画像もテストレポートも残らない。ジョブより短い
      # 制限をステップに置き、止まったときは失敗として成果物を残す。
      - name: Verify screenshots
        timeout-minutes: 45
        working-directory: app
        run: ./gradlew :androidApp:verifyRoborazziDebug ${{ matrix.shard.tests }} --stacktrace

      # 失敗時は比較画像（期待・実際・差分）を成果物として残す。差分の中身を見ないと
      # 意図した変更か回帰かを判断できないため。
      - name: Upload comparison images
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-comparison-${{ matrix.shard.name }}
          path: |
            app/androidApp/build/outputs/roborazzi
            app/androidApp/build/reports/tests/testDebugUnitTest
          retention-days: 7
