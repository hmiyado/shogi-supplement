name: Worker Test

# Why not androidApp/iosApp/uiの変更でもトリガー: ワーカーに関係ないapp変更でCIが回ると、
# 失敗時にどのモジュールの問題か分かりにくくなる。:shared配下はワーカーの依存先なので対象に含める。
on:
  pull_request:
    paths:
      - "app/server/worker/**"
      - "app/shared/**"
      - "app/gradle/**"
      - "app/gradle.properties"
      - "app/gradlew"
      - "app/gradlew.bat"
      - "app/build.gradle.kts"
      - "app/settings.gradle.kts"
      - ".github/workflows/worker-test.yml"
  push:
    branches:
      - main
    paths:
      - "app/server/worker/**"
      - "app/shared/**"
      - "app/gradle/**"
      - "app/gradle.properties"
      - "app/gradlew"
      - "app/gradlew.bat"
      - "app/build.gradle.kts"
      - "app/settings.gradle.kts"
      - ".github/workflows/worker-test.yml"

concurrency:
  group: worker-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      # Why not v6以降: キャッシュ機能がMIT対象外の商用コンポーネント（gradle-actions-caching）へ
      # 分離され、使用にGradle社のTerms of Use への同意が必要になった。キャッシュを無効にすれば
      # 読み込まれないが、CIが遅くなる。MITで完結するv5系に留める。
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # `--configure-on-demand`が無いと、このmonorepo内のandroidApp（Android SDK必須）も
      # 構成対象になりCIランナーにAndroid SDKが要る。付けることで:server:worker（と:shared）
      # だけを構成し、SDKセットアップを丸ごと不要にできる（実機確認済み）。
      - name: Run :server:worker:test
        working-directory: app
        run: ./gradlew :server:worker:test --configure-on-demand --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-test-report
          path: app/server/worker/build/reports/tests/test
          retention-days: 7
