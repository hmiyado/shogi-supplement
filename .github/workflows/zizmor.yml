name: zizmor

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "zizmor.yml"
      - "zizmor.yaml"
      - ".github/zizmor.yml"
      - ".github/zizmor.yaml"

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: python3 -m pip install zizmor==1.32.0
      - name: Audit all workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github/workflows
