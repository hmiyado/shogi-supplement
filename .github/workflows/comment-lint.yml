name: Comment Lint

on:
  pull_request:
    paths:
      - "**/*.kt"
      - "tools/comment_lint.py"
      - ".github/workflows/comment-lint.yml"

jobs:
  comment-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # 差分検査のためbase側の履歴が要る
          fetch-depth: 0
      - name: Check comments on changed files
        run: python3 tools/comment_lint.py --diff "origin/${{ github.base_ref }}"
