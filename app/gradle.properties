org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

# Kotlin/JSのnpm依存解決はYarnではなくnpm（Node同梱）を使う。ホスト/CIの追加要件をNodeだけにするため。
kotlin.js.yarn=false

# アプリのビルド番号（Android=versionCode）。androidApp/build.gradle.ktsのdefaultConfig.versionCodeと
# shared/build.gradle.ktsのBuildConfigフィールド（強制アップデート判定用）の両方がここを読む。
# 単一の値源にすることで、リリースごとに2箇所を別々に更新して食い違う事故を防ぐ
# （強制アップデート判定はビルド番号がずれると誤ブロック/誤fail-openに直結するため）。
shogisupplement.versionCode=8

# アプリのバージョン名（Android=versionName / iOS=MARKETING_VERSION）。
# Why not プラットフォームごとに定義: 別々に更新すると、ストアの表示とアプリ内の
# バージョン表示がAndroid/iOSで食い違うため。
shogisupplement.versionName=1.7
