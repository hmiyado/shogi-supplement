<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>画面遷移図</title>
<style>{{CSS}}</style>
<h1>画面遷移図</h1>
<p>NavigationMachineの遷移表から生成。機能ごとの枠内で流れを確認できます。枠をまたぐ矢印は共通画面への遷移です。画面を選ぶと関連する遷移だけを表示します。</p>
<p>各プラットフォームへの接続状況は、この図だけでは保証しません。解析イベントは表示中の要求IDが一致する場合だけ反映します。</p>
<p>ドラッグで移動、ピンチで拡大・縮小できます。</p>
<p><button id="fit">全体を表示</button><label><input id="returns" type="checkbox"> 戻る・再試行・エラーも表示</label> <button id="reset">選択を解除</button><label>拡大率 <input id="zoom" type="range" min="20" max="200" value="100"> <output id="scale">100%</output></label></p>
<div id="viewport"><svg id="graph" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" role="group" aria-label="画面遷移図"></svg></div>
<table><thead><tr><th>遷移元</th><th>操作</th><th>遷移先</th></tr></thead><tbody id="transitions"></tbody></table>
<script>const data={{DATA}};
{{JS}}</script></html>
