name: iosApp
options:
  bundleIdPrefix: dev.miyado.shogisupplement
  deploymentTarget:
    iOS: "17.0"
# 既定のDebug/Releaseに加え、エンジン・評価関数を一切リンクしないengineless configuration
# （GPL×App Store回避のためのフレーバー）。Debug/Releaseの挙動・既定スキーム（iosApp）は不変で、
# engineless系はビルド設定として追加されるだけ。
# ${CONFIGURATION}をそのままgradleタスク名の一部に使うpreBuildScripts（下記）の都合上、
# "-Engineless"サフィックス方式にしている（ハイフン抜きのタスク名にstripして解決する）。
configs:
  Debug: debug
  Release: release
  Debug-Engineless: debug
  Release-Engineless: release
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      # クラッシュレポート（Android側のsentry-androidと同じプロジェクトへ送信）。
      # SPMはこの環境のxcodebuild CLIで解決がハングするため、ビルド済み
      # XCFrameworkをベンダリングする（scripts/fetch-sentry.sh で取得・git管理外）。
      - framework: vendor/Sentry-Dynamic.xcframework
        embed: true
      # App Check（匿名アカウント量産への防御）。SentryやSupabaseと
      # 違いFirebaseはSPM向けの配布しか無い（CocoaPods用xcframework単体zipも無い）ため、
      # scripts/fetch-firebase.sh が公式Firebase.zip（全プロダクト同梱）から必要分だけを
      # 部分ダウンロードしてvendor/Firebaseへ置く（git管理外）。static xcframeworkだが
      # プライバシーマニフェスト（PrivacyInfo.xcprivacy）同梱のためembed: trueにする
      # （Firebase公式READMEの統合手順どおり。project.yml内の他フレームワークと同じ理由ではない）。
      - framework: vendor/Firebase/FirebaseCore.xcframework
        embed: true
      - framework: vendor/Firebase/FirebaseCoreInternal.xcframework
        embed: true
      - framework: vendor/Firebase/FirebaseAppCheck.xcframework
        embed: true
      - framework: vendor/Firebase/FirebaseAppCheckInterop.xcframework
        embed: true
      - framework: vendor/Firebase/AppCheckCore.xcframework
        embed: true
      - framework: vendor/Firebase/GoogleUtilities.xcframework
        embed: true
      - framework: vendor/Firebase/FBLPromises.xcframework
        embed: true
      - framework: vendor/Firebase/Promises.xcframework
        embed: true
      - framework: vendor/Firebase/RecaptchaInterop.xcframework
        embed: true
    sources:
      - path: iosApp
        excludes:
          - "Resources/**"
          - "Info.plist"
      - path: iosApp/Resources
        buildPhase: resources
      # engine_wrapper.h/.cpp はKotlin(:shared)のcinterop経由でのみ使う
      # （build_ios.shがlibshogiengine.aへコンパイル込み。実体はSharedUi.frameworkに
      # 埋め込まれるため、Xcodeターゲットのソースとしては含めない）。
      # 評価関数はリポジトリに複製せず、androidApp配下のnn.binを参照パスでバンドルする。
      # type: folder でフォルダ参照（青フォルダ）にし、ディレクトリ名"eval"を保ったまま
      # bundle直下にコピーする（Bundle.main.url(forResource:"eval", withExtension: nil)で参照）。
      - path: ../androidApp/src/main/assets/eval
        name: eval
        type: folder
        buildPhase: resources
      # 係数表（判定ロジックの不変条件）をiOS取込フロー（AnalysisOrchestrator）でも
      # 使うためバンドルする。androidApp/src/main/assets 側と複製せず参照パスで共有する
      # （evalディレクトリと同じ方式）。Bundle.main.pathForResource("coefficients_hao_isolate_v1",
      # ofType:"json") で参照する。
      - path: ../androidApp/src/main/assets/coefficients_hao_isolate_v1.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.miyado.shogisupplement.ios
        PRODUCT_NAME: iosApp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # CADisableMinimumFrameDurationOnPhone は GENERATE_INFOPLIST_FILE の
        # INFOPLIST_KEY_ 機構（既知キーのみ対応）では注入できないため、実ファイルを使用。
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 4
        INFOPLIST_FILE: iosApp/Info.plist
        # :ui が :shared を export した umbrella framework（SharedUi）に統一。
        # :shared.framework は二重リンクせず、SharedUi 経由で :shared の公開APIも使う。
        # FRAMEWORK_SEARCH_PATHS はビルド構成（Debug/Release）× SDK で出力先が
        # 異なるため settings.configs 側で定義する（下記）。
        # SQLDelight native-driver（sqliter）はシステムのsqlite3をcinterop経由で
        # 呼ぶため、明示的にリンクする必要がある。
        # :shared のcinterop linkerOpts（shared/build.gradle.kts）で
        # SharedUi.framework（静的framework）のビルド時に -L/-lshogiengine を渡しているが、
        # K/Nの静的frameworkはネイティブ依存を「解決込みで埋め込む」わけではなく
        # 未解決externのまま外部化する（要リンクフラグ）。
        # そのため、SharedUi.frameworkを消費するXcode側（このターゲット）でも改めて
        # libshogiengine.aへの -L/-l を通す必要がある。
        # wrapper C APIはKotlin cinterop経由でのみ使うため、
        # SWIFT_OBJC_BRIDGING_HEADER/HEADER_SEARCH_PATHSは不要。
        # -ObjC はFirebase（Objective-Cカテゴリを含む静的ライブラリ）を正しくロードするために
        # 必須（Firebase公式README・「Integration Instructions」手順8）。
        OTHER_LDFLAGS: "-framework SharedUi -lsqlite3 -lc++ -lshogiengine -ObjC"
        # アプリアイコン（駒型二色カプセル。androidApp のアダプティブアイコンと同意匠）。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App Attest（Firebase App Check）に必須のentitlements。無いとRelease実機で
        # トークン取得に失敗し、サーバーがApp Check必須のときに解析が401になる
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/engine/build/sim"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/engine/build/device"
        # SharedUi.framework（:ui の Kotlin/Native成果物）はApple Siliconホストでは
        # iosSimulatorArm64しかビルドされずx86_64スライスを持たない。
        # generic/platform=iOS Simulator destinationでのビルドはONLY_ACTIVE_ARCHが
        # 効かず（"active"な実機/シミュレータが定まらないため）ARCHS_STANDARD既定値
        # （arm64 x86_64）でリンクしようとしてx86_64側が未解決シンボルになるため、
        # シミュレータSDKではx86_64を明示的に除外する。
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "x86_64"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Xcode 16のDebug dylib機構がKotlin/Nativeフレームワークとのリンクで
        # "not an allowed client of SwiftUICore" を起こすため無効化する。
        ENABLE_DEBUG_DYLIB: NO
      configs:
        # Debug系のバンドルIDを分け、ストア版・TestFlight版と同じ端末に同居させる。
        # Firebaseはアプリ単位で設定が分かれるため、Debug系は専用の
        # GoogleService-Info-Debug.plistとApp Checkデバッグトークンの登録が要る
        # （どちらも無ければFirebase連携は起動せず、他の機能はそのまま動く）。
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.miyado.shogisupplement.ios.debug
          "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/../ui/build/bin/iosSimulatorArm64/debugFramework"
          "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/../ui/build/bin/iosArm64/debugFramework"
        Release:
          "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/../ui/build/bin/iosSimulatorArm64/releaseFramework"
          "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/../ui/build/bin/iosArm64/releaseFramework"
        # engineless: フレームワーク出力先はDebug/Releaseと同じ（:uiのGradleタスク名・出力パスは
        # iosEngineless有無で変わらない。中身が違うだけ）。OTHER_LDFLAGSだけ -lshogiengine を外す
        # （リンク自体を外すのが目的のため、baseの値を丸ごと上書きする）。
        Debug-Engineless:
          PRODUCT_BUNDLE_IDENTIFIER: dev.miyado.shogisupplement.ios.debug
          "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/../ui/build/bin/iosSimulatorArm64/debugFramework"
          "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/../ui/build/bin/iosArm64/debugFramework"
          OTHER_LDFLAGS: "-framework SharedUi -lsqlite3 -lc++ -ObjC"
          # Swift側のエンジン依存コード（DEBUG用EngineView等）を#if !ENGINELESSで外すためのフラグ
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG ENGINELESS"
        Release-Engineless:
          "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/../ui/build/bin/iosSimulatorArm64/releaseFramework"
          "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/../ui/build/bin/iosArm64/releaseFramework"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ENGINELESS"
          OTHER_LDFLAGS: "-framework SharedUi -lsqlite3 -lc++ -ObjC"
    preBuildScripts:
      - name: "Verify CURRENT_PROJECT_VERSION matches gradle.properties versionCode"
        script: |
          set -e
          EXPECTED="$(grep '^shogisupplement.versionCode=' "$SRCROOT/../gradle.properties" | cut -d= -f2)"
          if [ -z "$EXPECTED" ]; then
            echo "error: shogisupplement.versionCode が gradle.properties に見つかりません" >&2
            exit 1
          fi
          if [ "$CURRENT_PROJECT_VERSION" != "$EXPECTED" ]; then
            echo "error: CURRENT_PROJECT_VERSION ($CURRENT_PROJECT_VERSION) が gradle.properties の shogisupplement.versionCode ($EXPECTED) と不一致。project.yml を直してください" >&2
            exit 1
          fi
      - name: "Build Shared+UI Kotlin Framework (gradlew :ui:linkDebugFramework<Target>)"
        # シミュレータ/実機どちらでビルドされるかで:uiのK/Nターゲットを、
        # Debug/Releaseで:uiのリンクタスクを、それぞれ切り替える
        # （$PLATFORM_NAMEはXcodeがSDKに応じて設定する。iphoneos=実機/iphonesimulator=シミュレータ。
        # $CONFIGURATIONは"Debug"/"Release"がそのままgradleタスク名に一致する）。
        #
        # engineless configuration（Debug-Engineless/Release-Engineless）は末尾の
        # "-Engineless" を取り除いた名前がgradleタスク名（linkDebugFramework等）に対応する。
        # gradleタスク自体は常に同じ（:ui:linkDebugFrameworkIos...）で、エンジンの有無は
        # -PiosEngineless=true の有無だけで切り替わる（shared/build.gradle.kts参照）。
        script: |
          set -e
          cd "$SRCROOT/.."
          BASE_CONFIGURATION="${CONFIGURATION%-Engineless}"
          GRADLE_ARGS=()
          if [ "$BASE_CONFIGURATION" != "$CONFIGURATION" ]; then
            GRADLE_ARGS+=("-PiosEngineless=true")
          fi
          if [ "$PLATFORM_NAME" = "iphoneos" ]; then
            TASK=":ui:link${BASE_CONFIGURATION}FrameworkIosArm64"
          else
            TASK=":ui:link${BASE_CONFIGURATION}FrameworkIosSimulatorArm64"
          fi
          JAVA_HOME=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home ./gradlew "$TASK" "${GRADLE_ARGS[@]}"
        basedOnDependencyAnalysis: false
      # Supabase接続設定（URL/anonキー）とサーバー解析のベースURLを app/local.properties
      # から読んで SupabaseConfig.properties としてバンドルへ直接生成する（Androidの
      # local.properties→BuildConfig と同じ方針でリポジトリに秘密を置かない）。
      # local.properties が無い/キーが無いビルドでは空になり、
      # アプリ側はアカウント導線・サーバー解析を非表示/端末解析にフォールバックする
      # （IosSupabaseConfig.kt参照）。
      - name: "Generate SupabaseConfig.properties (from app/local.properties)"
        script: |
          set -e
          PROPS="$SRCROOT/../local.properties"
          OUT_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$OUT_DIR"
          URL=""
          KEY=""
          ANALYSIS_BASE_URL=""
          if [ -f "$PROPS" ]; then
            URL=$(sed -n 's/^SUPABASE_URL=//p' "$PROPS" | head -1)
            KEY=$(sed -n 's/^SUPABASE_KEY=//p' "$PROPS" | head -1)
            ANALYSIS_BASE_URL=$(sed -n 's/^ANALYSIS_BASE_URL=//p' "$PROPS" | head -1)
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\nANALYSIS_BASE_URL=%s\n' \
            "$URL" "$KEY" "$ANALYSIS_BASE_URL" > "$OUT_DIR/SupabaseConfig.properties"
        basedOnDependencyAnalysis: false
      # Sentry DSN も同じ経路（app/local.properties→ビルド時生成）でバンドルする。
      # 公開するとイベントを外部から投げ込まれるリスクがあるためリポジトリに秘密を置かない。
      # 未設定ビルドでは空になり、IosSentryConfig.swift 経由でSentry初期化自体をスキップする。
      - name: "Generate SentryConfig.properties (from app/local.properties)"
        script: |
          set -e
          PROPS="$SRCROOT/../local.properties"
          OUT_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$OUT_DIR"
          DSN=""
          if [ -f "$PROPS" ]; then
            DSN=$(sed -n 's/^SENTRY_DSN=//p' "$PROPS" | head -1)
          fi
          printf 'SENTRY_DSN=%s\n' "$DSN" > "$OUT_DIR/SentryConfig.properties"
        basedOnDependencyAnalysis: false
      # Firebase App Check設定ファイル。SupabaseConfig.propertiesと同じ流儀だが、
      # こちらはFirebase SDKがバンドル直下の実ファイル名（GoogleService-Info.plist）を
      # 前提にしているため、値を読んで再生成せずファイルをそのままコピーする。
      # local/GoogleService-Info.plist が無いビルドでは何もしない＝Swift側
      # （IosFirebaseAppCheck.swift）がバンドル内に無いことを見てFirebase初期化ごと
      # スキップする（graceful degradation。他のconfig生成と同じ方針）。
      #
      # Why not Debug系でも本番のplistを使う: バンドルIDが一致しないとApp Checkの
      # 検証が常に403になり、Firebase初期化自体は成功するため切り分けが難しい。
      # Debug系専用のファイルが無いときは何もコピーしない（Firebase連携を起動しない）。
      - name: "Copy GoogleService-Info.plist (from iosApp/local, if present)"
        script: |
          set -e
          case "$CONFIGURATION" in
            Debug|Debug-Engineless) SRC="$SRCROOT/local/GoogleService-Info-Debug.plist" ;;
            *) SRC="$SRCROOT/local/GoogleService-Info.plist" ;;
          esac
          OUT_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$OUT_DIR"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$OUT_DIR/GoogleService-Info.plist"
          fi
        basedOnDependencyAnalysis: false
      # App Checkの固定デバッグトークン（Debug実機運用向け。Firebaseへの登録が
      # 1回で済み、再インストールしても変わらない）。Release/TestFlightに混入させない
      # ためCONFIGURATIONで絞る。
      # Why not "$CONFIGURATION" = "Debug"（完全一致）: Debug-Engineless構成の
      # $CONFIGURATION は文字列 "Debug-Engineless" になるため完全一致では素通りし、
      # トークン未同梱→フォールバックの端末生成トークンはFirebase未登録のため
      # App Check検証が常に403になる。Debug系（Debug・Debug-Engineless）を
      # 対象にし、Release系だけを除外する。
      - name: "Copy AppCheckDebugToken.txt (from iosApp/local, Debug/Debug-Engineless only, if present)"
        script: |
          set -e
          SRC="$SRCROOT/local/AppCheckDebugToken.txt"
          OUT_DIR="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$OUT_DIR"
          case "$CONFIGURATION" in
            Debug|Debug-Engineless)
              if [ -f "$SRC" ]; then
                cp "$SRC" "$OUT_DIR/AppCheckDebugToken.txt"
              fi
              ;;
          esac
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: "Sync Compose Resources into app bundle (gradlew :ui:syncComposeResourcesForIos)"
        # :ui のフォント等（commonMain/composeResources）は通常 embedAndSignAppleFrameworkForXcode
        # が担う compose-resources 同梱をこのタスク単体で行う（framework埋め込みを
        # 手動リンクにしているため、resources同梱だけ別途呼び出す）。
        script: |
          set -e
          cd "$SRCROOT/.."
          JAVA_HOME=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home ./gradlew :ui:syncComposeResourcesForIos
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # engineless構成では評価関数（eval/nn.bin=GPL）もバンドルから外す。
      # Why not sourcesの条件分岐: XcodeGenのresources定義は構成別に出し分けられないため、
      # 全構成でバンドルしたあとengineless側だけ削る。
      - name: "Strip GPL eval resources (Engineless only)"
        script: |
          set -e
          case "$CONFIGURATION" in
            *-Engineless)
              rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/eval"
              ;;
          esac
        basedOnDependencyAnalysis: false
      # Why not Info.plist本体へ記載: ATS例外はDebug限定にしたいがInfo.plistは全構成共通で、
      # Debug用plistの複製を作ると同期問題が再発する。ビルド後の生成物へ注入して
      # Releaseの配布物には一切含めない。
      # バンドルIDを分けても、アイコンと名前が同じでは同居した2つを見分けられない。
      - name: "Mark the app as a development build (Debug only)"
        script: |
          set -e
          case "$CONFIGURATION" in
            Debug|Debug-Engineless)
              PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
              /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 将棋サプリ Dev" "$PLIST"
              ;;
          esac
        basedOnDependencyAnalysis: false
      - name: "Allow local networking (Debug only, for local asset delivery)"
        script: |
          set -e
          case "$CONFIGURATION" in
            Debug*)
              PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
              /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
              /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"
              /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$PLIST" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 開発中のWASMバイナリをMacのローカル配信から取得する検証に使います" "$PLIST"
              ;;
          esac
        basedOnDependencyAnalysis: false
  # 実機スモークテスト用 XCUITest ターゲット。iosApp と同じ Team/署名設定で自動署名する。
  # フィクスチャ（Fixtures/wars_game3.kif）は app/shared/src/jvmTest/resources からのコピーで、
  # .gitignore 済み（リポジトリに新たな棋譜を追加しない方針のため）。
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosAppUITests
        excludes:
          - "Fixtures/**"
      - path: iosAppUITests/Fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.miyado.shogisupplement.ios.iosAppUITests
        PRODUCT_NAME: iosAppUITests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: C8DX3743C6
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: iosApp
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppUITests
  # エンジン・評価関数を一切リンクしないフレーバー（GPL×App Store回避）。
  # iosAppスキームには一切手を入れず、こちらは別スキームとして追加するだけ
  # （既定のiosAppスキームの挙動は不変）。
  iosApp-Engineless:
    build:
      targets:
        iosApp: all
        iosAppUITests: [test]
    run:
      config: Debug-Engineless
    test:
      config: Debug-Engineless
      targets:
        - iosAppUITests
    archive:
      config: Release-Engineless
