steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker build -f checks/Dockerfile.candidate --build-arg BASE_IMAGE=${_BASE_IMAGE} -t ${_IMAGE} .
        docker build -f checks/Dockerfile.driver -t study-fixture checks
        docker network create --internal study-isolated
        trap 'docker logs worker; docker rm -f worker fixture >/dev/null 2>&1 || true; docker network rm study-isolated >/dev/null 2>&1 || true' EXIT
        docker run -d --name worker --network study-isolated --cpus=4 --memory=2g \
          -e PORT=8080 -e SUPABASE_URL=http://fixture:8081 \
          -e SUPABASE_SERVICE_ROLE_KEY=fixture-service-key \
          -e SUPABASE_JWKS_URL=http://fixture:8081/auth/v1/.well-known/jwks.json \
          -e SUPABASE_JWT_ISSUER=http://fixture:8081/auth/v1 \
          -e FIREBASE_PROJECT_NUMBER= -e ANALYSIS_WORKERS=4 \
          -e STUDY_ENGINE_PATH=/opt/engine/study/yaneuraou \
          -e STUDY_ENGINE_EVAL_DIR=/opt/engine/study/eval \
          -e STUDY_ENGINE_REV=v9.80@d47c9bfb94210fb1f9b741d5ee16ce081b35cacd \
          -e STUDY_ENGINE_EVAL_SHA256=f8ee839ae8c08537036f23345dd5ed0416958b22425476fc60177942903219b5 \
          -e STUDY_ENGINE_FV_SCALE=40 ${_IMAGE}
        docker run --name fixture --network study-isolated --cpus=1 --memory=512m study-fixture
        docker exec -i worker bash < checks/engine-stop.sh
        docker stats --no-stream --format '{{json .}}' worker
        docker inspect --format 'ISOLATED_NETWORK={{json .NetworkSettings.Networks}} MEMORY_LIMIT={{.HostConfig.Memory}} OOM={{.State.OOMKilled}}' worker
        docker image inspect --format 'CANDIDATE_IMAGE_ID={{.Id}}' ${_IMAGE}
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 600s
