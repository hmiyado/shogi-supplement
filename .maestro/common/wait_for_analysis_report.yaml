# 解析完了後の終端状態を待つ。「解析中... N / M 局面」はNが高速に更新され続けるため、
# 瞬間的なスナップショットではassertVisibleがタイミング次第で失敗することがある
# （Composeの再コンポジションとMaestroのスナップショット取得タイミングが競合する。
# 実害はUI取得可否ではなくテキストが速く変わりすぎること）。そのため進捗表示は見ず、
# 遷移先の安定した画面（レポート画面の悪手率、または悪手なし表示）を待つ。
# 呼び出し元フローのenvで指定（iOS/Android両方から使うため固定しない）
appId: ${APP_ID}
---
- extendedWaitUntil:
    # Maestroのテキスト一致は全文regexのため、前後の可変部を含めてワイルドカードで包む。
    #
    # Why not ラベルだけを見る: 解析中のサマリーカードも同じラベル行を「—」で出すので、
    # ラベルは解析開始と同時に現れる。数字が入っていることまで見ないと、解析中の画面を
    # 完了と取り違えて後続が空のデータの上を走る（実測: 116手の解析開始2秒で通過した）。
    visible: ".*悪手率.*[0-9].*|.*悪手は見つかりませんでした.*"
    timeout: 600000
