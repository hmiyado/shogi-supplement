# 解析完了後の終端状態を待つ。「解析中... N / M 局面」はNが高速に更新され続けるため、
# 瞬間的なスナップショットではassertVisibleがタイミング次第で失敗することがある
# （Composeの再コンポジションとMaestroのスナップショット取得タイミングが競合する。
# 実害はUI取得可否ではなくテキストが速く変わりすぎること）。そのため進捗表示は見ず、
# 遷移先の安定した画面（レポート画面の推定棋力行、または悪手なし表示）を待つ。
# 呼び出し元フローのenvで指定（iOS/Android両方から使うため固定しない）
appId: ${APP_ID}
---
- extendedWaitUntil:
    # Maestroのテキスト一致は全文regexのため、前後の可変部（「（偏差値・参考値）: …」等）
    # を含めてマッチするようワイルドカードで包む
    visible: ".*この一局からの推定棋力.*|.*悪手は見つかりませんでした.*"
    timeout: 120000
