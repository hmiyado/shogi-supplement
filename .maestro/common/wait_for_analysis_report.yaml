# 解析中の進捗は固定のナビ行にあり、完了後のサマリーは時間グラフの下にある。
appId: ${APP_ID}
---
- extendedWaitUntil:
    notVisible: "解析中.*"
    timeout: 600000
# 画面中央は固定盤面なので、下部のスクロール領域をスワイプする。
- repeat:
    times: 20
    while:
      notVisible: ".*悪手率.*[0-9].*|.*悪手は見つかりませんでした.*"
    commands:
      - swipe:
          start: "90%, 90%"
          end: "90%, 65%"
          duration: 500
      - waitForAnimationToEnd
- assertVisible: ".*悪手率.*[0-9].*|.*悪手は見つかりませんでした.*"
