# クリップボードに有効なKIFが無い状態でペーストを試し、システムのペースト許可アラート
# （springboard）とアプリ側の「クリップボードに棋譜（KIF）が見つかりませんでした」エラー
# ダイアログの両方をMaestroが素通り・検証できるかを確認するフロー。
#
# 前提: クリップボードに有効なKIF以外のテキストが入っていること。設定込みの実行入口は
# .maestro/run-ios.sh。
appId: dev.miyado.shogisupplement.ios.debug
---
- launchApp:
    clearState: false
- runFlow: subflows/handle_consent_onboarding.yaml
- tapOn: "棋譜を追加する"
- tapOn: "クリップボードから貼り付け"
- runFlow: subflows/dismiss_paste_permission_alert.yaml
- assertVisible: "クリップボードに棋譜（KIF）が見つかりませんでした"
