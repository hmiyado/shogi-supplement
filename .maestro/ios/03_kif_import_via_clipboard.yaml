# クリップボード経由のKIF取込フロー全体（起動→KIF追加→貼り付け→棋力設定→先後選択→
# 解析開始→レポート表示）をMaestroで駆動できるかを確認するフロー。
#
# 前提: OSクリップボードに有効なKIFテキストが入っていること。投入込みの実行入口は
# .maestro/run-ios.sh（フロー内で完結させない理由もそちらに記載）。
#
# 棋力設定ダイアログは対局サービスのアカウント名が1つも未設定のときだけ先に出る。
# 初回実行後は出なくなるため、毎回試すなら
# `maestro test --clear-state` や `clearState: true` でアプリのデータをリセットすること。
appId: dev.miyado.shogisupplement.ios.debug
# 共通フロー（appId: ${APP_ID}）へ引き渡す
env:
  APP_ID: dev.miyado.shogisupplement.ios.debug
---
- launchApp:
    clearState: false
- runFlow: subflows/handle_consent_onboarding.yaml
- assertVisible: "将棋サプリ"
- tapOn: "棋譜を追加する"
- tapOn: "クリップボードから貼り付け"
- runFlow: subflows/dismiss_paste_permission_alert.yaml
- runFlow: ../common/select_gote_and_start_analysis.yaml
- runFlow: ../common/wait_for_analysis_report.yaml
- runFlow: ../common/open_estimated_strength_detail.yaml
