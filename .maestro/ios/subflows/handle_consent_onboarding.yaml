# 同意オンボーディング（iOS専用）はSupabase設定ありのビルドの初回起動でのみ
# ホームより先に全画面で出る。ビルド設定・既存の同意状態に依存して出ないことがある
# ため、必須ステップとして待たず「出たときだけ処理する」optional構成にしている。
#
appId: dev.miyado.shogisupplement.ios.debug
---
- extendedWaitUntil:
    visible: "はじめに"
    timeout: 5000
    optional: true
- tapOn:
    text: "アカウントを作成せずに始める"
    optional: true
- tapOn:
    text: "規約に同意して始める"
    optional: true
- extendedWaitUntil:
    notVisible: "はじめに"
    timeout: 15000
    optional: true
