<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棋譜を検討する — 将棋サプリ</title>
<link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* ComposeViewportのマウント先。高さを明示しないとCompose側がコンテンツに
     フィットするサイズで固定してしまい、fillMaxSize()が効かない。 */
  #composeApp { min-height: 100vh; }
</style>
</head>
<body>
<div id="composeApp">
  <!-- Compose Wasm本体(十数MB)の読み込み中はcomposeAppが空でページが無反応に見えるため、
       静的HTMLのローダーを置く。Composeはこのdivへcanvasを追加するので、
       canvasの出現をもって役目を終える(下のscript)。 -->
  <div id="appLoading" class="app-loading" role="status">
    <div class="app-loading-spinner" aria-hidden="true"></div>
    <p>読み込んでいます…</p>
  </div>
</div>
<script>
  (function () {
    const container = document.getElementById("composeApp");
    const loading = document.getElementById("appLoading");
    const observer = new MutationObserver(() => {
      if (container.querySelector("canvas")) {
        loading.remove();
        observer.disconnect();
      }
    });
    observer.observe(container, { childList: true, subtree: true });
  })();
</script>
<footer>
  <p class="footer-nav">
    <a href="./index.html">将棋サプリ トップ</a>
    <a href="./help.html">ヘルプ</a>
    <a href="./terms.html">利用規約・プライバシーポリシー</a>
  </p>
</footer>
<script src="kento/webapp-bridge.js"></script>
<script src="kento/webApp.js"></script>
</body>
</html>
