<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1.0">
<title>将棋サプリ 1.12 — iPad</title>
<style>
  @font-face { font-family: "Shippori Mincho"; src: url("../assets/fonts/shippori_mincho_bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "IBM Plex Sans JP"; src: url("../assets/fonts/ibm_plex_sans_jp_regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "IBM Plex Sans JP"; src: url("../assets/fonts/ibm_plex_sans_jp_bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../assets/fonts/ibm_plex_mono_semi_bold.ttf") format("truetype"); font-weight: 600; }
  :root {
    --bg: #F7F3EA; --surface: #FFFDF7; --ink: #211E1A; --ink2: #5C564C;
    --ink3: #8C857B; --line: #DDD5C4; --primary: #3A4B7C;
    --sans: "IBM Plex Sans JP", sans-serif; --mincho: "Shippori Mincho", serif;
    --mono: "IBM Plex Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 720px; }
  body { position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 12px; background: var(--primary); }
  .content { height: 100%; padding: 54px 66px 44px 82px; }
  .brand { display: flex; align-items: center; gap: 16px; color: var(--ink2); font-family: var(--mincho); font-size: 53px; line-height: 1.15; font-weight: 700; letter-spacing: .02em; }
  .brand img { width: 44px; height: 54px; }
  .intro { width: 500px; }
  .version { margin-top: 26px; color: var(--primary); font-family: var(--mono); font-size: 24px; font-weight: 600; letter-spacing: .04em; }
  .features { display: flex; flex-direction: column; gap: 14px; width: 500px; margin-top: 40px; }
  .feature { display: grid; grid-template-columns: 54px 1fr; align-items: center; min-height: 92px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--primary); border-radius: 12px; }
  .number { color: var(--primary); font-family: var(--mono); font-size: 20px; font-weight: 600; }
  .feature h2 { margin: 0 0 3px; font-size: 22px; line-height: 1.35; }
  .feature p { margin: 0; color: var(--ink2); font-size: 16px; line-height: 1.45; }
  .ipad-wrap { position: absolute; left: 610px; top: 150px; width: 520px; }
  .ipad { width: 520px; height: 410px; padding: 9px; background: #151411; border: 1px solid #4a463d; border-radius: 27px; box-shadow: 14px 16px 0 rgba(33, 30, 26, .09); transform: none; }
  .ipad img { display: block; width: 502px; height: 376px; object-fit: cover; border-radius: 18px; }
  .ipad::after { content: ""; position: absolute; right: 18px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: #8c857b; }
</style>
</head>
<body>
  <main class="content">
    <section class="intro">
      <div class="brand"><img src="../assets/app-icon.svg" alt=""><span>将棋サプリ</span></div>
      <div class="version">UPDATE 1.12</div>
      <div class="features">
        <article class="feature"><div class="number">01</div><div><h2>アダプティブレイアウト対応</h2><p>盤面とグラフや検討内容が横画面に適した表示になります</p></div></article>
        <article class="feature"><div class="number">02</div><div><h2>レポート画面のタブ切り替え</h2><p>サマリー・悪手一覧・検討をタブで切り替えられます</p></div></article>
        <article class="feature"><div class="number">03</div><div><h2>検討候補手の表示</h2><p>評価値とともに候補手を3つまで確認できます</p></div></article>
      </div>
    </section>
    <aside class="ipad-wrap">
      <div class="ipad"><img src="../../app/androidApp/src/test/snapshots/promo_report_study_ipad.png" alt="将棋サプリのiPad横画面レポート・検討タブ"></div>
    </aside>
  </main>
</body>
</html>
