<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接続先設定と棋譜選択の変更案</title><link rel="stylesheet" href="../assets/style.css"><style>
body{background:#f7f3ea;color:#211e1a;margin:0;font-family:"IBM Plex Sans JP",sans-serif}main{max-width:960px;margin:24px auto;padding:16px}h1,h2{font-family:"Shippori Mincho",serif}h1{font-size:24px}h2{font-size:18px}.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}.screen{background:#fffdf7;border:1px solid #ddd5c4;border-radius:12px;padding:16px}.top{border-bottom:1px solid #ddd5c4;padding-bottom:12px}p{line-height:1.75}.note{font-size:12px;color:#5c564c}.row{display:flex;align-items:center;gap:16px;margin:18px 0}button,input{font:inherit}button{min-height:44px;padding:8px 16px;border:1px solid #ddd5c4;border-radius:8px;color:#3a4b7c;background:#fffdf7;cursor:pointer}.primary{background:#3a4b7c;color:#fffdf7}input[type=text]{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd5c4;border-radius:8px}.nav{display:flex;justify-content:space-between;gap:8px;background:#e7e9f2;padding:8px;margin:16px -8px}.nav button:nth-child(2){flex:1;border:0;background:transparent}.data{font-family:"IBM Plex Mono",monospace}.board{display:grid;grid-template-columns:repeat(9,1fr);background:#e9c98e;border:1px solid #a98b54;margin:16px 0}.cell{aspect-ratio:1;border:0.5px solid #a98b54;display:grid;place-items:center;font:22px serif}.card{background:#efe9dc;padding:14px;margin-top:16px;border-radius:8px}dialog{border:1px solid #ddd5c4;border-radius:12px;background:#fffdf7;color:#211e1a;padding:16px;max-width:420px;width:calc(100% - 64px)}dialog::backdrop{background:#211e1a66}.option{width:100%;text-align:left;border:0;border-bottom:1px solid #ddd5c4;border-radius:0}.chosen{background:#f7efc5}.status{min-height:48px;color:#3a4b7c;font-size:12px}
</style><main><h1>接続先設定と棋譜選択の変更案</h1><p class="note">操作確認用のモックです。実際の接続先や保存データは変更しません。</p><div class="screens">
<section class="screen"><div class="top">← デバッグ</div><h2>接続先</h2><p>現在の接続先：本番</p><div class="row"><label><input type="radio" name="env" value="prod" checked> 本番</label><label><input type="radio" name="env" value="lan"> LAN内の開発環境</label></div><label for="host">MacのURL</label><input type="text" id="host" placeholder="http://192.168.1.10:4179" value="http://192.168.1.10:4179"><p class="note">棋譜・アカウントは接続先ごとに分けて保存します。変更はアプリの再起動後に反映します。</p><button class="primary" id="save">保存</button><p class="status" id="status"></p><div class="card"><h2>WASM配信元</h2><p class="note">既存の設定をこの下に表示</p></div></section>
<section class="screen"><div class="top">← 共有された棋譜</div><p class="note">▲自分　△相手</p><div class="board" id="board"></div><div class="nav"><button id="prev" aria-label="1手戻る">‹</button><button id="choose"><span class="data" id="current"></span>　⌄</button><button id="next" aria-label="1手進む">›</button></div><div class="card"><h2>検討</h2><p class="note">候補手・評価値・検討手順は既存の表示を使用</p></div><p class="note">手数表示を押すと棋譜一覧を開きます。</p></section></div>
<dialog id="moves"><h2>棋譜</h2><div id="options"></div><button id="close">閉じる</button></dialog></main><script>
const labels=['初期局面','▲７六歩','△３四歩','▲２六歩','△８四歩'];let ply=3;
function render(){const start=['lnsgkgsnl',' r     b ','ppppppppp','         ','         ','         ','PPPPPPPPP',' B     R ','LNSGKGSNL'].map(r=>r.split(''));const seq=[[2,6,2,5],[6,2,6,3],[7,6,7,5],[1,2,1,3]];for(let i=0;i<ply;i++){let[x,y,a,b]=seq[i];start[b][a]=start[y][x];start[y][x]=' '}const glyph={l:'香',n:'桂',s:'銀',g:'金',k:'王',r:'飛',b:'角',p:'歩'};document.getElementById('board').innerHTML=start.flat().map(c=>'<span class="cell">'+(glyph[c.toLowerCase()]||'')+'</span>').join('');document.getElementById('current').textContent=ply+'手目 '+labels[ply];document.getElementById('prev').disabled=ply===0;document.getElementById('next').disabled=ply===4}
document.getElementById('choose').onclick=()=>{document.getElementById('options').innerHTML=labels.map((v,i)=>'<button class="option '+(i===ply?'chosen':'')+'" data-ply="'+i+'">'+i+'　'+v+'</button>').join('');document.getElementById('moves').showModal()};
document.getElementById('options').onclick=e=>{const p=e.target.dataset.ply;if(p!==undefined){ply=Number(p);render();document.getElementById('moves').close()}};
document.getElementById('close').onclick=()=>document.getElementById('moves').close();document.getElementById('prev').onclick=()=>{ply--;render()};document.getElementById('next').onclick=()=>{ply++;render()};document.getElementById('save').onclick=()=>document.getElementById('status').textContent='保存しました。アプリを再起動すると反映します。（モック）';render();
</script></html>
