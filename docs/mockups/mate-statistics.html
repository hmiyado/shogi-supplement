<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>推定棋力 — 詰みの統計</title>
<style>
@font-face{font-family:body;src:url('../assets/fonts/ibm_plex_sans_jp_regular.ttf')}@font-face{font-family:heading;src:url('../assets/fonts/shippori_mincho_bold.ttf')}@font-face{font-family:mono;src:url('../assets/fonts/ibm_plex_mono_regular.ttf')}
*{box-sizing:border-box}body{margin:0;background:#F7F3EA;color:#211E1A;font:15px body,sans-serif;line-height:1.75}main{max-width:600px;margin:auto;padding:16px 16px 24px}h1{font:28px heading;margin:8px 0 12px}h2{font:17px heading;margin:0}p{margin:0}.small{font-size:12px;color:#5C564C}.sample{padding:6px 16px;background:#F7EFC5;display:flex;align-items:center;justify-content:space-between;gap:8px}.sample select{font:12px body;color:#211E1A;background:transparent;border:0;border-bottom:1px solid #DDD5C4;padding:4px;max-width:180px}.back{font-size:13px;color:#3A4B7C;text-decoration:none}.number{font-family:mono;font-variant-numeric:tabular-nums}.strength-card{background:#FFFDF7;border:1px solid #DDD5C4;border-radius:12px;padding:16px;margin-top:12px;min-width:0}.strength-value{font:34px mono;color:#3A4B7C;margin:4px 0}.strength-range{font:13px mono;color:#5C564C}.strength-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.trend-preview{width:100%;height:132px;display:block;margin-top:12px}.trend-labels{display:flex;justify-content:space-between;font:12px mono;color:#5C564C}.coverage{border-top:1px solid #DDD5C4;padding-top:12px;margin-top:12px}.mate-chart{margin-top:16px}.axis-title{font:12px body;color:#5C564C}.chart-body{display:flex;margin-top:20px;gap:8px}.y-axis{position:relative;flex:0 0 30px;height:220px;font:11px mono;color:#5C564C}.y-axis span{position:absolute;right:0;transform:translateY(-50%)}.chart-scroll{flex:1;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;padding-top:10px;margin-top:-10px;padding-bottom:4px;scrollbar-color:#B7AE9C #F0EBDD;scrollbar-width:thin}.chart-scroll:focus-visible{outline:2px solid #3A4B7C;outline-offset:2px}.chart-content{width:100%}.bar-plot{height:220px;position:relative}.h-grid{position:absolute;left:0;right:0;border-top:1px solid #DDD5C4;pointer-events:none}.bar-slot{position:absolute;bottom:0;transform:translateX(-50%);height:100%;display:flex;align-items:flex-end;justify-content:center}.bar{width:100%;max-width:44px;background:#3A4B7C;position:relative}.bar-percent{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);font:11px mono;color:#3A4B7C;white-space:nowrap}.missing{font:13px body;color:#5C564C;padding-bottom:6px}.x-labels{display:grid;text-align:center;padding-top:10px;font:12px mono;color:#211E1A}.x-labels small{display:block;font:11px mono;color:#5C564C;margin-top:2px;white-space:nowrap}.x-title{text-align:center;margin:10px 0 0;padding-left:38px}.chart-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:13px body;color:#5C564C;text-align:center}
</style>
<div class="sample small"><span>表示案 · 架空のデータ</span><label>状態 <select id="state" aria-label="モックの表示状態"><option value="normal">集計あり</option><option value="long">最大31手以上</option><option value="empty">機会なし</option><option value="legacy">旧解析のみ</option></select></label></div>
<main><a class="back" href="#" onclick="return false">‹ ホーム</a><h1>推定棋力</h1>
<section class="strength-card"><p class="small">現在の推定棋力</p><p class="strength-value">55.2</p><p class="strength-range">推定範囲 44.3–66.1</p></section>
<section class="strength-card"><div class="strength-head"><h2>対局ごとの推移</h2><span class="small">直近<span class="number">30</span>日</span></div><svg class="trend-preview" viewBox="0 0 500 132" role="img" aria-label="対局ごとの推定棋力の推移。表示確認用の架空データ"><g stroke="#DDD5C4" stroke-width="1"><path d="M38 16H486M38 62H486M38 108H486"/></g><g fill="#5C564C" font-family="mono" font-size="11"><text x="0" y="20">65.0</text><text x="0" y="66">50.0</text><text x="0" y="112">35.0</text></g><path d="M50 70L135 58L220 66L305 45L390 53L475 46" fill="none" stroke="#3A4B7C" stroke-width="2"/><g fill="#3A4B7C"><circle cx="50" cy="70" r="3"/><circle cx="135" cy="58" r="3"/><circle cx="220" cy="66" r="3"/><circle cx="305" cy="45" r="3"/><circle cx="390" cy="53" r="3"/><circle cx="475" cy="46" r="3"/></g></svg><div class="trend-labels"><span>9/20</span><span>10/19</span></div></section>
<section class="section strength-card" id="mate-card"><h2>詰み</h2><p class="small">詰み手数ごとの成功率</p><div id="chart"></div><div class="coverage small" id="coverage"></div></section><section class="strength-card"><h2>対局サービス</h2><p class="small">未入力</p></section></main>
<script>
const normalRows=[{plies:1,success:5,total:6},{plies:3,success:4,total:6},{plies:5,success:2,total:5},{plies:7,success:1,total:3},{plies:11,success:1,total:4}];
const longRows=[...normalRows,{plies:13,success:3,total:8},{plies:15,success:2,total:9},{plies:17,success:1,total:7},{plies:19,success:2,total:8},{plies:21,success:1,total:6},{plies:23,success:1,total:5},{plies:25,success:0,total:4},{plies:27,success:1,total:8},{plies:29,success:1,total:7},{plies:31,success:1,total:5},{plies:33,success:1,total:4},{plies:37,success:0,total:3}];
function bucketsFor(rows){
 const grouped=new Map();
 for(const row of rows){const plies=Math.min(31,row.plies),previous=grouped.get(plies)||{plies,success:0,total:0};grouped.set(plies,{plies,success:previous.success+row.success,total:previous.total+row.total})}
 const maximum=rows.length?Math.min(31,Math.max(...rows.map(row=>row.plies))):0;
 return Array.from({length:(maximum+1)/2},(_,i)=>grouped.get(i*2+1)||{plies:i*2+1,success:0,total:0});
}
function render(){
 const state=document.getElementById('state').value,rows=state==='long'?longRows:state==='normal'?normalRows:[],data=bucketsFor(rows);
 const cellWidth=Math.max(44,...data.map(row=>(`${row.success}/${row.total}`.length*7)+12));
 document.getElementById('chart').innerHTML=`<div class="mate-chart"><div class="axis-title">成功率（%）</div><div class="chart-body"><div class="y-axis" aria-hidden="true">${[100,75,50,25,0].map(p=>`<span style="top:${100-p}%">${p}</span>`).join('')}</div><div class="chart-scroll" tabindex="0" aria-label="詰み手数ごとの棒グラフ。横にスクロールできます"><div class="chart-content" style="min-width:${Math.max(1,data.length)*cellWidth}px"><div class="bar-plot" role="group" aria-label="詰み手数ごとの成功率">${[0,25,50,75,100].map(p=>`<div class="h-grid" style="bottom:${p}%"></div>`).join('')}${data.map((row,i)=>{const x=(i+.5)/data.length*100,label=row.plies===31?'31手詰以上':`${row.plies}手詰`,pct=row.total?Math.round(row.success/row.total*100):null;return `<div class="bar-slot" style="left:${x}%;width:${70/data.length}%" role="img" aria-label="${label}、${pct===null?'機会なし':`成功率${pct}パーセント、${row.total}機会中${row.success}成功`}">${pct===null?'<span class="missing">—</span>':`<div class="bar" style="height:${row.success/row.total*100}%"><span class="bar-percent">${pct}%</span></div>`}</div>`}).join('')}${!data.length?`<p class="chart-empty">${state==='legacy'?'再解析すると集計できます':'対象となる機会がありません'}</p>`:''}</div><div class="x-labels" style="grid-template-columns:repeat(${Math.max(1,data.length)},minmax(0,1fr))">${data.length?data.map(row=>`<div><span>${row.plies===31?'31+':row.plies}</span><small>${row.success}/${row.total}</small></div>`).join(''):'<div aria-hidden="true">—<small>—</small></div>'}</div></div></div></div><p class="axis-title x-title">詰み手数（手）</p></div>`;
 document.getElementById('coverage').innerHTML=state==='legacy'?'解析済み <span class="number">30</span>局 · 集計対象 <span class="number">0</span>局':'解析済み <span class="number">30</span>局 · 集計対象 <span class="number">22</span>局 · 旧解析 <span class="number">8</span>局';
}
 document.getElementById('state').addEventListener('change',render);render();
</script></html>
