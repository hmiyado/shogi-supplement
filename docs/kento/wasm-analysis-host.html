<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>iOS WASM解析ホスト</title>
</head>
<body>
<!--
  WKWebViewが読み込む内部ページ（ユーザーが直接開くページではない）。2つの独立した機能を
  公開する:

  - バッチ解析（1局まるごと）: window.__startAnalysis(movesJson, assetBaseUrl) /
    __cancelAnalysis()。docs/kento/webapp-bridge.js（Web版=:webAppと共通の2Worker並列解析JS。
    変更しない）をそのまま動かし、"wasmAnalysis" ハンドラへ通知する。
  - 対話的単発局面解析: window.__initStudy(assetBaseUrl) /
    __analyzePosition(requestId, baseSfenArg, movesJson)。docs/kento/study-worker.js
    （バッチ用analysis-worker.jsとは別プロトコル。ファイル冒頭のコメント参照）を運用し、
    "wasmStudy" ハンドラへ通知する。

  どちらか一方の機能だけを使う場合、対応するメッセージハンドラだけを登録すればよい:
  未登録側への postMessage は post()/postStudy() の try/catch が黙って無視する。
-->
<script src="webapp-bridge.js"></script>
<script src="wasm-analysis-host.js"></script>
</body>
</html>
